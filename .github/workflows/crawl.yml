name: hsmoa 편성 수집

on:
  schedule:
    # 매일 05:10 KST (= 20:10 UTC 전날). GitHub Actions cron 은 항상 UTC 기준.
    # 스케줄 러너는 혼잡하면 수 분~수십 분 밀릴 수 있다 — 편성 수집엔 문제 없음.
    - cron: "10 20 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "오늘 기준 오프셋 (공백 구분). 예: -1 0 1"
        required: false
        default: "-1 0 1"

concurrency:
  group: hsmoa-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: python -m playwright install --with-deps chromium

      - name: 편성 수집 + 대시보드 생성
        env:
          TZ: Asia/Seoul
        run: python run.py --days ${{ github.event.inputs.days || '-1 0 1' }}

      - name: 수집 결과 확인
        id: check
        run: |
          rows=$(python - <<'PY'
          import sqlite3, pathlib
          p = pathlib.Path("data/hsmoa.sqlite")
          if not p.exists():
              print(0); raise SystemExit
          print(sqlite3.connect(p).execute(
              "SELECT COUNT(*) FROM broadcasts").fetchone()[0])
          PY
          )
          echo "누적 편성 건수: $rows"
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          if [ "$rows" -eq 0 ]; then
            echo "::warning::수집된 편성이 0건입니다. 아래 디버그 아티팩트를 확인하세요."
          fi

      - name: 디버그 원본 업로드 (파싱 실패 대비)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-snapshot-${{ github.run_number }}
          path: |
            data/raw/
            data/discovery.json
            data/unknown_channels.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: 데이터 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/hsmoa.sqlite data/schedule.csv data/discovery.json docs/index.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 편성 데이터 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
