# 품목 카테고리 분류 규칙
#
# 동작 방식: 상품명을 정규화한 뒤 아래 카테고리를 priority 오름차순으로 훑으면서
# keywords 중 하나라도 걸리면 그 카테고리로 확정한다. (첫 매치 승리)
# priority 가 낮을수록 먼저 검사 -> 더 구체적인 카테고리를 위에 둔다.
#
# 예) "홍삼정 에브리타임" 은 식품(홍삼)보다 건강기능식품(홍삼정)이 먼저 걸려야 하므로
#     건강기능식품의 priority 를 식품보다 낮게 준다.

