# 브랜드 추출 힌트
brand_extraction:
  # 상품명 앞에 붙는 프로모션 머리말 -> 브랜드가 아니므로 제거
  noise_prefixes:
    - 단독, 최초, 방송최초, première, 프리미어, 신상, 신상품, 앵콜, 앙코르, 재방송
    - 特價, 특가, 초특가, 오늘만, 마지막, 라스트, 한정, 수량한정, 무이자, 일시불
    - 렌탈, 렌털, 무료배송, 무배, 사은품, 세일, 할인, 균일가, 오늘의딜
    - 완판, 매진임박, 인기, 베스트, 추천, 히트, 강력추천, LIVE, 라이브
    - TV, 방송, 홈쇼핑, 온에어, ONAIR
  # 브랜드로 오인되기 쉬운 일반명사 -> 브랜드 후보에서 제외
  stopwords:
    - 세트, 기획, 구성, 패키지, 종합, 모음, 특집, 대전, 페어, 위크
    - 남성, 여성, 남녀공용, 공용, 시니어, 주니어, 프리미엄, 명품, 정품
    - 국내산, 국산, 수입, 해외, 직수입, 산지직송, 무료, 증정
    - 대용량, 소용량, 실속, 알뜰, 가성비, 초경량, 신형, 구형
