# 홈쇼핑 채널 정규화 사전
# hsmoa 가 내려주는 표기가 사이트 개편에 따라 조금씩 달라지므로,
# 여기서 canonical(정식 회사명)으로 통일한다.
# aliases 에 없는 값이 나오면 원문 그대로 보존하고 unknown_channels.txt 에 기록한다.

channels:
